      <stop offset="0" stop-color="#11131a"/><stop offset="1" stop-color="#202635"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000" flood-opacity=".45"/>
